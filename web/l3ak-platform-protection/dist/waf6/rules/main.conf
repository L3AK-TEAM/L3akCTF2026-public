Include @coraza.conf-recommended


SecRequestBodyLimit 1048576
SecRequestBodyInMemoryLimit 1048576
SecRequestBodyLimitAction Reject

Include @crs-setup.conf.example


SecAction \
    "id:1001,phase:1,nolog,pass,t:none,\
    setvar:tx.inbound_anomaly_score_threshold=1000,\
    setvar:tx.outbound_anomaly_score_threshold=1000"

Include @owasp_crs/*.conf

SecRule &FILES "@ge 1" \
    "id:1004,phase:2,deny,status:403,log,msg:'multipart file upload not allowed'"

SecRule REQUEST_URI|ARGS|ARGS_NAMES|REQUEST_BODY "@rx (?i):constructor\"" \
    "id:1002,phase:2,deny,status:403,log,msg:'blocked :constructor\" pattern'"

SecRule REQUEST_URI|ARGS|ARGS_NAMES|REQUEST_BODY "@rx (?i):constructor\"" \
    "id:1003,phase:2,deny,status:403,log,t:none,t:urlDecodeUni,t:jsDecode,\
    msg:'blocked :constructor\" pattern (unicode-decoded)'"



FlightRule join-reassembly     on  type=match      pattern=:join           passes=5

FlightRule path-module-id      on  type=number     value=14747,23574,24373 passes=5
FlightRule constructor-decode  on  type=match      pattern=:constructor    passes=4
FlightRule unstable-nesting    on  type=stabilize                          passes=4

FlightRule bundler-constructor on  type=match      pattern=:"constructor   passes=4
FlightRule djb2-module-id      on  type=number     value=23932             passes=5
FlightRule bundler-config      on  type=match      pattern=_bundlerConfig  passes=4


SecRuleEngine On

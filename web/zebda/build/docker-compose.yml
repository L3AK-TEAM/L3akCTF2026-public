name: zebda

services:
  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      WORKER_URL: "http://worker:8000"
      NODE_ENV: "production"
    depends_on:
      - worker
    networks:
      - frontend
      - backend
    expose:
      - "8080"


  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      PORT: "8000"
      FLAG_PATH: "/flag.txt"
    volumes:
      - ./flag.txt:/flag.txt:ro
    networks:
      - backend
    expose:
      - "8000"


  nginx:
    image: nginx:stable-alpine3.24-slim
    ports:
      - "80:80"
    networks:
      - frontend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - middleware


networks:
  frontend:
  
  backend:
    internal: true